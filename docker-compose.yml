volumes:
  app_node_modules:
  rustfs_data:

networks:
  nextintranet_net:
    driver: bridge
  default:
    driver: bridge
    ipam:
      driver: default

services:
  db_nextintranet:
    image: postgres:18.1-alpine
    volumes:
      - ./.data/postgres_18:/var/lib/postgresql
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextintranet}
      - POSTGRES_USER=${POSTGRES_USER:-nextintranet_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nextintranet_password}
    networks:
      - nextintranet_net

  web:
    build:
      context: nextintranet_backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        BUILD_DATE: ${BUILD_DATE:-}
        BUILD_METHOD: ${BUILD_METHOD:-development}
    volumes:
      - ./nextintranet_backend:/app
      - ./.data/:/data
      - ./.git:/app/.gitinfo:ro
    #ports:
    #  - "8080:8000"
    env_file:
      - .env
    environment:
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://rustfs:9000}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-/s3}
    depends_on:
      - db_nextintranet
      - redis
      - rustfs
    networks:
      - nextintranet_net
  
  web_asgi:
    build:
      context: nextintranet_backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        BUILD_DATE: ${BUILD_DATE:-}
        BUILD_METHOD: ${BUILD_METHOD:-development}
    container_name: webasgi
    volumes:
      - ./nextintranet_backend:/app
      - ./.data/:/data
      - ./.git:/app/.gitinfo:ro
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=nextintranet_backend.settings
    entrypoint: ["/bin/sh", "-c"]
    command: ["daphne -b 0.0.0.0 -p 8001 nextintranet_backend.asgi:application"]
    depends_on:
      - db_nextintranet
      - redis
    networks:
      - nextintranet_net

  worker:
    build:
      context: nextintranet_backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        BUILD_DATE: ${BUILD_DATE:-}
        BUILD_METHOD: ${BUILD_METHOD:-development}
    volumes:
      - ./nextintranet_backend:/app
      - ./.data/:/data
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command: ["python manage.py qcluster"]
    depends_on:
      - db_nextintranet
      - redis
      - rustfs
    networks:
      - nextintranet_net

  frontend:
    build:
      context: nextintranet_frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./nextintranet_frontend:/app
      - ./documentation:/app/documentation:ro
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=
      - VITE_WS_URL=ws://localhost:9000
    command: /bin/sh -lc "pnpm --filter @nextintranet/app dev -- --host 0.0.0.0"
#    ports:
#      - "5173:5173"
    networks:
      - nextintranet_net
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx_config/realip.conf:/etc/nginx/conf.d/00-realip.conf:ro
      - ./nginx_config/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "9000:80"
#      - "9010:9003"
    depends_on:
      frontend:
        condition: service_started
      web:
        condition: service_started
        restart: true
      web_asgi:
        condition: service_started
        restart: true
    networks:
      - nextintranet_net

  redis:
    image: redis:8.4-alpine
    volumes:
      - ./.data/redis:/data
    depends_on:
      - db_nextintranet
    networks:
      - nextintranet_net

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.89
    container_name: rustfs
    volumes:
      - rustfs_data:/data
#    ports:
#      - "${RUSTFS_PORT:-9001}:9000"
#      - "${RUSTFS_CONSOLE_PORT:-9004}:9001"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - RUSTFS_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - RUSTFS_REGION=${S3_REGION_NAME:-us-east-1}
    networks:
      - nextintranet_net

  rustfs_init:
    image: minio/mc:latest
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://rustfs:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for rustfs...'; sleep 1;
      done &&
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET:-nextintranet-dev} &&
      /usr/bin/mc anonymous set download local/${MINIO_BUCKET:-nextintranet-dev}
      "
    networks:
      - nextintranet_net
